# Variante de docker-compose.staging.yml adaptee a un deploiement via
# Coolify (panneau auto-heberge, https://coolify.io) : Coolify possede
# deja son propre reverse proxy avec HTTPS automatique (Let's Encrypt),
# donc AUCUN service Caddy ici — Coolify route directement vers les
# services `api` et `web` en fonction des domaines que vous assignez
# dans son interface (voir docs/deployment/staging.md, section Coolify).
#
# Meme isolation reseau que la version generique : Postgres et Redis
# restent strictement internes (aucun "ports:", reseau "backend"
# internal:true), apps/web n'y a jamais acces (reseau "internal-api"
# separe, uniquement api<->web).
#
# Dans l'interface Coolify, apres avoir ajoute ce fichier comme
# ressource "Docker Compose" :
# 1. Assignez un domaine au service "web" (ex: staging.savemycontrollers.fr)
# 2. Assignez un domaine au service "api" (ex: api.staging.savemycontrollers.fr)
# 3. Renseignez toutes les variables de .env.staging.example dans l'onglet
#    "Environment Variables" du projet Coolify (jamais dans ce fichier).

name: smc-staging

networks:
  backend:
    internal: true # Postgres et Redis : AUCUNE sortie vers l'exterieur, aucune entree publique, meme via Coolify.
  internal-api:
    internal: true # api <-> web uniquement : web n'a JAMAIS acces a postgres/redis, meme en interne.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [backend]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:-smc_staging}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?} -d ${POSTGRES_DB:-smc_staging}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [backend]
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: ${IMAGE_REGISTRY:?}-api:${IMAGE_TAG:-latest}
    networks: [backend]
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-smc_staging}?schema=public
      NODE_ENV: production
      SEED_DEMO_CATALOG: "true"
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?}
      CSRF_SECRET: ${CSRF_SECRET:?}
      PAYLOAD_ENCRYPTION_KEY: ${PAYLOAD_ENCRYPTION_KEY:?}
    depends_on:
      postgres: { condition: service_healthy }
    command: ["sh", "-c", "node_modules/.bin/prisma migrate deploy --schema=prisma/schema.prisma && node_modules/.bin/tsx prisma/seed/index.ts"]
    restart: "no"

  api:
    image: ${IMAGE_REGISTRY:?}-api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [backend, internal-api]
    # Port interne expose au proxy de Coolify (PAS publie sur l'hote :
    # Coolify s'y connecte via le reseau Docker et gere le HTTPS/domaine
    # lui-meme quand vous assignez un domaine a ce service dans son
    # interface).
    expose: ["3001"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-smc_staging}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?}
      CSRF_SECRET: ${CSRF_SECRET:?}
      PAYLOAD_ENCRYPTION_KEY: ${PAYLOAD_ENCRYPTION_KEY:?}
      JWT_ISSUER: ${JWT_ISSUER:-savemycontrollers-staging}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-savemycontrollers-staging-api}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:?}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?}
      # Coolify est le seul proxy en amont : un seul "hop" de confiance.
      TRUSTED_PROXY_COUNT: "1"
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_FROM: ${SMTP_FROM:-SaveMyControllers Staging <staging@example.invalid>}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-https://staging-storage.invalid}
      STORAGE_REGION: ${STORAGE_REGION:-eu-west-3}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-smc-staging}
      STORAGE_ACCESS_KEY_ID: ${STORAGE_ACCESS_KEY_ID:-placeholder}
      STORAGE_SECRET_ACCESS_KEY: ${STORAGE_SECRET_ACCESS_KEY:-placeholder}
      THROTTLE_LIMIT_PER_MINUTE: ${THROTTLE_LIMIT_PER_MINUTE:-120}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    image: ${IMAGE_REGISTRY:?}-worker:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [backend]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-smc_staging}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?}
      CSRF_SECRET: ${CSRF_SECRET:?}
      PAYLOAD_ENCRYPTION_KEY: ${PAYLOAD_ENCRYPTION_KEY:?}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  web:
    image: ${IMAGE_REGISTRY:?}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks: [internal-api]
    expose: ["3000"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      # Composants serveur (reseau Docker interne, plus rapide, ne sort
      # pas vers Internet). Distinct de NEXT_PUBLIC_API_URL (navigateur),
      # deja fige DANS L'IMAGE au moment du build par
      # .github/workflows/deploy-staging.yml — le redefinir ici n'aurait
      # aucun effet sur le code cote navigateur.
      API_URL: http://api:3001
    depends_on:
      api: { condition: service_healthy }

volumes:
  postgres-data:
  redis-data:
